name: Run v0.18.3 production hardening v3

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  run-hardening:
    if: github.head_ref == 'fix/v0.18.3-production-hardening' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: vscode-ext/package-lock.json
      - name: Apply, format, validate, and commit hardening
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap
          source = Path('.github/workflows/apply-v0183-hardening.yml').read_text(encoding='utf-8')
          start = "          cat > /tmp/apply_hardening.py <<'PY'\n"
          end = "\n          PY\n          python /tmp/apply_hardening.py"
          block = textwrap.dedent(source.split(start, 1)[1].split(end, 1)[0])
          block = block.replace('tests/unit/test_cross_agent_lifecycle.py', 'tests/unit/test_lifecycle.py')
          Path('/tmp/apply_hardening.py').write_text(block, encoding='utf-8')
          PY
          python /tmp/apply_hardening.py
          python -m pip install -e ".[dev,pg]"
          python -m ruff format src tests scripts/prepare_auto_release.py scripts/extract_release_notes.py scripts/preflight.py
          set +e
          python scripts/preflight.py --profile full --check --base-ref origin/main > preflight-output.txt 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            printf 'exit_code=%s\n' "$status" > HARDENING_DIAGNOSTIC.txt
            cat preflight-output.txt >> HARDENING_DIAGNOSTIC.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add HARDENING_DIAGNOSTIC.txt
            git commit -m "chore: update hardening preflight diagnostic"
            git push origin "HEAD:${{ github.head_ref }}"
            exit "$status"
          fi
          rm -f HARDENING_DIAGNOSTIC.txt preflight-output.txt
          rm -f .github/workflows/apply-v0183-hardening.yml
          rm -f .github/workflows/diagnose-hardening.yml
          rm -f .github/workflows/diagnose-preflight-v0183.yml
          rm -f .github/workflows/run-v0183-hardening.yml
          rm -f .github/workflows/run-v0183-hardening-v2.yml
          rm -f .github/workflows/run-v0183-hardening-v3.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: harden automatic memory recovery and PR gates"
          git push origin "HEAD:${{ github.head_ref }}"
