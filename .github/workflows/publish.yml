name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare release body from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v version="$version" '
            $0 == "## [" version "] - " substr($0, length("## [" version "] - ") + 1) { in_section=1; next }
            in_section && /^## \[/ { exit }
            in_section { print }
          ' CHANGELOG.md > release_body.md
          if [ ! -s release_body.md ]; then
            echo "Could not find a CHANGELOG.md section for $version" >&2
            echo "Expected heading like: ## [$version] - YYYY-MM-DD" >&2
            exit 1
          fi
          echo "Release notes from CHANGELOG.md:"
          cat release_body.md

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release_body.md
          generate_release_notes: false

  publish:
    needs: release
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - run: python -m pip install --upgrade build twine

      - run: python -m build

      - run: python -m twine check dist/*

      - uses: pypa/gh-action-pypi-publish@release/v1

  publish-vscode:
    needs: publish
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci
        working-directory: vscode-ext

      - name: Compile extension
        run: npm run compile
        working-directory: vscode-ext

      - name: Publish to VS Code Marketplace
        run: |
          set +e
          output="$(npx @vscode/vsce publish --no-dependencies 2>&1)"
          status=$?
          echo "$output"
          if [ "$status" -ne 0 ]; then
            if echo "$output" | grep -qi "already exists"; then
              echo "VS Code Marketplace version already exists; treating duplicate publish as success."
              exit 0
            fi
            exit "$status"
          fi
        working-directory: vscode-ext
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}