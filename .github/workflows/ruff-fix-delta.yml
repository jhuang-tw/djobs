name: Apply pinned Ruff fixes

on:
  push:
    branches:
      - feat/delta-context

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/delta-context
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Apply the exact CI Ruff version
        run: |
          python -m pip install ruff==0.15.14
          python -m ruff check --fix --config pyproject.toml src tests
          python -m ruff format --config pyproject.toml src tests
          python -m ruff check --config pyproject.toml src tests
          python -m ruff format --check --config pyproject.toml src tests

      - name: Commit fixes
        run: |
          rm .github/workflows/ruff-fix-delta.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: satisfy pinned Ruff checks"
          git push origin HEAD:feat/delta-context
