name: Apply zero-touch patch

on:
  push:
    branches:
      - feature/zero-touch-first-mcp-call
    paths:
      - .github/zero-touch-patch.ready

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/zero-touch-first-mcp-call
          fetch-depth: 0
      - name: Apply verified patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/zero-touch-patch.part-* | base64 --decode > /tmp/zero-touch.patch
          git apply --check -p2 /tmp/zero-touch.patch
          git apply -p2 /tmp/zero-touch.patch
          rm -f .github/zero-touch-patch.part-* .github/zero-touch-patch.ready
          rm -f .github/workflows/temp-zero-touch-export.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: initialize memory on first MCP call"
          git push origin HEAD:feature/zero-touch-first-mcp-call
