              """- Set `DJOBS_CAPTURE_USER_INTENT=0` to disable automatic prompt-intent capture.
- Mark memory `resolved`, `superseded`, `stale`, or `contradicted` when it should stop influencing
  normal recovery.
""",
              """- Set `DJOBS_CAPTURE_USER_INTENT=0` to disable automatic prompt-intent capture.
