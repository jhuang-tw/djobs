version: "3.9"

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: djobs
      POSTGRES_PASSWORD: djobs
      POSTGRES_DB: djobs
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U djobs"]
      interval: 2s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
