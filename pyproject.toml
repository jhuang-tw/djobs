[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "djobs"
version = "0.5.0"
description = "Durable workflow control for AI coding agents — inspectable, resumable, controllable multi-file work that survives context loss."
requires-python = ">=3.11"
license = "MIT"
readme = "README.md"
keywords = ["mcp", "ai-agent", "crash-recovery", "task-queue", "durable", "sqlite", "copilot", "cursor", "cline", "audit-log"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Topic :: System :: Distributed Computing",
]

dependencies = [
    "mcp[cli]>=1.0",
]

[project.urls]
Homepage = "https://github.com/jhuang-tw/djobs"
Repository = "https://github.com/jhuang-tw/djobs"
Issues = "https://github.com/jhuang-tw/djobs/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "mypy>=1.10",
]
pg = [
    "psycopg[binary]>=3.1",
]

[project.scripts]
djobs = "djobs.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/djobs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
src = ["src", "tests"]
target-version = "py311"
line-length = 99

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]

[tool.mypy]
python_version = "3.11"
files = ["src/djobs"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
