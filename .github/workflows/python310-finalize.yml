name: Python 3.10 Finalizer

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    if: github.head_ref == 'refactor/remove-mcp-daemon' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/remove-mcp-daemon
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Harden datetime import migration
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tools/apply_python310.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              'r"^from datetime import (?P<body>\\([^)]*\\)|[^\\n]+)$", re.MULTILINE',
              'r"^(?P<indent>[ \\t]*)from datetime import (?P<body>\\([^)]*\\)|[^\\n]+)$", re.MULTILINE',
          )
          text = text.replace(
              'return "from datetime import " + ", ".join(names)',
              'return match.group("indent") + "from datetime import " + ", ".join(names)',
          )
          path.write_text(text, encoding='utf-8')
          PY

      - name: Apply Python 3.10 compatibility update
        id: migrate
        continue-on-error: true
        run: python tools/apply_python310.py > py310-migration-report.txt 2>&1

      - name: Upload migration report
        if: steps.migrate.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: py310-migration-report
          path: py310-migration-report.txt

      - name: Stop after migration failure
        if: steps.migrate.outcome == 'failure'
        run: |
          cat py310-migration-report.txt
          exit 1

      - name: Remove one-shot migration machinery
        run: |
          rm tools/apply_python310.py
          rm .github/workflows/python310-finalize.yml

      - name: Validate manifests and diff
        run: |
          python -m json.tool server.json >/dev/null
          python -m json.tool vscode-ext/package.json >/dev/null
          python -m json.tool vscode-ext/package-lock.json >/dev/null
          git diff --check

      - name: Use Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install on Python 3.10
        run: |
          python --version
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev,pg]'

      - name: Normalize migrated Python files
        id: normalize
        continue-on-error: true
        run: |
          ruff format src/ tests/ > py310-ruff-report.txt 2>&1
          ruff check --fix src/ tests/ >> py310-ruff-report.txt 2>&1

      - name: Upload Ruff report
        if: steps.normalize.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: py310-ruff-report
          path: py310-ruff-report.txt

      - name: Stop after Ruff failure
        if: steps.normalize.outcome == 'failure'
        run: |
          cat py310-ruff-report.txt
          exit 1

      - name: Validate Python 3.10
        run: |
          python -m compileall -q src tests
          ruff check src/ tests/
          ruff format --check src/ tests/
          mypy
          pytest -q --tb=short

      - name: Validate extension
        working-directory: vscode-ext
        run: |
          npm ci
          npx tsc -p ./ --noEmit
          npm run compile

      - name: Guard Python 3.10 support
        run: |
          grep -q 'requires-python = ">=3.10"' pyproject.toml
          grep -q 'target-version = "py310"' pyproject.toml
          grep -q 'python_version = "3.10"' pyproject.toml
          grep -q 'python-version: \["3.10", "3.11", "3.12", "3.13", "3.14"\]' .github/workflows/ci.yml
          ! grep -R -n -E 'from datetime import[^$]*\bUTC\b' src tests

      - name: Commit finalized compatibility update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'compat: support Python 3.10 and newer'
          git push origin HEAD:refactor/remove-mcp-daemon
