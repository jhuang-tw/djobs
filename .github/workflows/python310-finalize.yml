name: Python 3.10 Finalizer

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    if: github.head_ref == 'refactor/remove-mcp-daemon' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/remove-mcp-daemon
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Apply Python 3.10 compatibility update
        run: python tools/apply_python310.py

      - name: Remove one-shot migration machinery
        run: |
          rm tools/apply_python310.py
          rm .github/workflows/python310-finalize.yml

      - name: Validate manifests and diff
        run: |
          python -m json.tool server.json >/dev/null
          python -m json.tool vscode-ext/package.json >/dev/null
          python -m json.tool vscode-ext/package-lock.json >/dev/null
          git diff --check

      - name: Use Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install on Python 3.10
        run: |
          python --version
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev,pg]'

      - name: Normalize migrated Python files
        run: |
          ruff check --fix src/ tests/
          ruff format src/ tests/

      - name: Validate Python 3.10
        run: |
          python -m compileall -q src tests
          ruff check src/ tests/
          ruff format --check src/ tests/
          mypy
          pytest -q --tb=short

      - name: Validate extension
        working-directory: vscode-ext
        run: |
          npm ci
          npx tsc -p ./ --noEmit
          npm run compile

      - name: Guard Python 3.10 support
        run: |
          grep -q 'requires-python = ">=3.10"' pyproject.toml
          grep -q 'target-version = "py310"' pyproject.toml
          grep -q 'python_version = "3.10"' pyproject.toml
          grep -q 'python-version: \["3.10", "3.11", "3.12", "3.13", "3.14"\]' .github/workflows/ci.yml
          ! grep -R -n -E 'from datetime import[^$]*\bUTC\b' src tests

      - name: Commit finalized compatibility update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'compat: support Python 3.10 and newer'
          git push origin HEAD:refactor/remove-mcp-daemon
