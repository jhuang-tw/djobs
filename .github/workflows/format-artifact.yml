name: Apply canonical format

on:
  push:
    branches: [feat/adoption-readiness]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/adoption-readiness
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install pre-commit
      - name: Apply pinned Ruff formatter
        run: pre-commit run ruff-format --all-files || true
      - name: Commit canonical formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/djobs/auto_hook.py src/djobs/entrypoint.py tests/unit/test_auto_hook.py
          git commit -m "style: apply pinned Ruff formatter"
          git push origin HEAD:feat/adoption-readiness
