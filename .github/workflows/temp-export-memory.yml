name: Apply verified project-memory patch

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/project-memory.ready"

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'feature/project-memory-core'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/project-memory-core
          fetch-depth: 0
      - name: Apply verified patch and remove temporary files
        run: |
          set -euo pipefail
          cat .github/project-memory.patch.gz.b64.part-* | base64 --decode | gzip --decompress > /tmp/project-memory.patch
          git apply --check /tmp/project-memory.patch
          git apply /tmp/project-memory.patch
          rm -f .github/project-memory.patch.gz.b64.part-*
          rm -f .github/project-memory.ready
          rm -f .github/workflows/temp-export-memory.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add meaningful searchable project memory"
          git push origin HEAD:feature/project-memory-core
