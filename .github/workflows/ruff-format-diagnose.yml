name: Apply pinned Ruff formatting

on:
  push:
    branches: [release/layered-recovery-presentation]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/layered-recovery-presentation
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pre-commit
      - name: Apply pinned formatter and remove temporary workflow
        run: |
          pre-commit run ruff-format --all-files || true
          git rm .github/workflows/ruff-format-diagnose.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'style: apply pinned Ruff formatting'
          git push origin HEAD:release/layered-recovery-presentation
