name: Apply Ruff formatter

on:
  push:
    branches: [release/layered-recovery-presentation]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/layered-recovery-presentation
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install ruff==0.15.14
      - name: Apply exact project formatting
        run: |
          ruff format --config pyproject.toml src tests scripts/prepare_auto_release.py
          git rm .github/workflows/apply-ruff-format.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'style: apply Ruff 0.15.14 formatting'
          git push origin HEAD:release/layered-recovery-presentation
