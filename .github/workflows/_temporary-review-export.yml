name: Temporary review export

on:
  push:
    branches:
      - stabilize/public-readiness-20260724

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build offline wheelhouse
        run: |
          python -m pip install --upgrade pip
          python -m pip wheel --wheel-dir wheelhouse ".[dev,pg]"
      - name: Archive exact source
        run: git archive --format=zip --output=djobs-source.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: djobs-review-source
          path: |
            djobs-source.zip
            wheelhouse/
          retention-days: 1
