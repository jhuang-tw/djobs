  <text x="12" y="75" fill="#585b70" class="ln l1">================================================================</text>
  <text x="12" y="93" fill="#a6e3a1" class="ln l2">  djobs — Legacy Crash-Proof Migration Demo</text>
  <text x="12" y="111" fill="#585b70" class="ln l3">================================================================</text>
  <text x="12" y="129" fill="#cdd6f4" class="ln l4">&#160;</text>
  <text x="12" y="147" fill="#cdd6f4" class="ln l5">  Workspace : examples/demo_workspace</text>
  <text x="12" y="165" fill="#cdd6f4" class="ln l6">  Files     : 27 Python files to add docstrings</text>
  <text x="12" y="183" fill="#cdd6f4" class="ln l7">  Crash at  : file #12 (simulated IDE crash)</text>
  <text x="12" y="201" fill="#cdd6f4" class="ln l8">&#160;</text>
  <text x="12" y="219" fill="#585b70" class="ln l9">────────────────────────────────────────────────────────────────</text>
  <text x="12" y="237" fill="#89b4fa" class="ln l10">STEP 1 │ Check for prior work (first session)</text>
  <text x="12" y="255" fill="#585b70" class="ln l11">────────────────────────────────────────────────────────────────</text>
  <text x="12" y="273" fill="#89b4fa" class="ln l12">  → No incomplete tasks. Starting fresh.</text>
  <text x="12" y="291" fill="#cdd6f4" class="ln l13">&#160;</text>
  <text x="12" y="309" fill="#585b70" class="ln l14">────────────────────────────────────────────────────────────────</text>
  <text x="12" y="327" fill="#89b4fa" class="ln l15">STEP 2 │ Enqueue one task per file</text>
