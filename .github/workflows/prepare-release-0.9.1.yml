name: Prepare release 0.9.1

on:
  push:
    branches:
      - release/0.9.1
    paths:
      - .github/workflows/prepare-release-0.9.1.yml

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/0.9.1
          fetch-depth: 0

      - name: Update release metadata
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations

          import json
          import re
          from pathlib import Path

          version = "0.9.1"
          release_date = "2026-07-19"

          init_path = Path("src/djobs/__init__.py")
          init_text = init_path.read_text(encoding="utf-8")
          init_text, count = re.subn(
              r'__version__\s*=\s*["\'][^"\']+["\']',
              f'__version__ = "{version}"',
              init_text,
              count=1,
          )
          if count != 1:
              raise SystemExit("Could not update exactly one __version__ assignment")
          init_path.write_text(init_text, encoding="utf-8")

          changelog_path = Path("CHANGELOG.md")
          changelog = changelog_path.read_text(encoding="utf-8")
          heading = f"## [{version}] - {release_date}"
          if heading in changelog:
              raise SystemExit(f"{heading} already exists")
          marker = "## [Unreleased]\n"
          if marker not in changelog:
              raise SystemExit("CHANGELOG.md is missing the Unreleased section")
          section = f'''\n## [{version}] - {release_date}\n\n### Added\n- `[core]` **Batch checkpoint tools.** Added `enqueue_batch` and `complete_batch` so agents can create or close many durable tasks in one MCP call instead of paying one orchestration round trip per task.\n- `[core]` **Budgeted resume capsules.** Added `resume_capsule`, a compact and paginated recovery view that preserves exact queue state in SQLite while exposing only the fields and number of tasks that fit the requested context budget.\n\n### Changed\n- `[core]` **Context-efficient MCP is now the default.** The installed `djobs-mcp` command, `djobs mcp`, and the checked-in VS Code MCP configuration now expose batch and capsule tools without requiring a separate opt-in entry point. The legacy `python -m djobs.mcp_server` entry point remains available.\n- `[core]` **Native batch arrays.** Batch tools now accept native arrays directly while keeping JSON-string compatibility, removing redundant model-side serialization.\n- `[docs]` **Accurate product positioning.** Package metadata and context-efficiency documentation now describe measured, budgeted orchestration behavior instead of making an unqualified token-savings claim.\n- `[release]` **MCP SDK compatibility boundary.** The Python dependency is constrained to `mcp>=1.0,<2` until the v2 API is explicitly validated.\n\n### Fixed\n- `[core]` **Tiny context budgets are respected.** `resume_capsule` no longer forces an oversized first task into the response; it returns an empty page with `budget.exhausted=true` so callers can increase the budget or retrieve a full record intentionally.\n- `[core]` **CLI database overrides remain intact.** Routing `djobs mcp` through the context-efficient server preserves the existing `--db` behavior and leaves every non-MCP CLI command unchanged.\n'''
          changelog = changelog.replace(marker, marker + section, 1)
          changelog_path.write_text(changelog, encoding="utf-8")

          package_path = Path("vscode-ext/package.json")
          package = json.loads(package_path.read_text(encoding="utf-8"))
          package["version"] = version
          package_path.write_text(json.dumps(package, indent=2) + "\n", encoding="utf-8")

          lock_path = Path("vscode-ext/package-lock.json")
          lock = json.loads(lock_path.read_text(encoding="utf-8"))
          lock["version"] = version
          lock.setdefault("packages", {}).setdefault("", {})["version"] = version
          lock_path.write_text(json.dumps(lock, indent=2) + "\n", encoding="utf-8")

          server_path = Path("server.json")
          server = json.loads(server_path.read_text(encoding="utf-8"))
          server["version"] = version
          server["description"] = "Durable workflow state and context-efficient MCP orchestration for coding agents."
          for package_entry in server.get("packages", []):
              package_entry["version"] = version
          server_path.write_text(json.dumps(server, indent=2) + "\n", encoding="utf-8")

          Path(".github/workflows/prepare-release-0.9.1.yml").unlink()
          PY

      - name: Verify release metadata
        shell: bash
        run: |
          node vscode-ext/scripts/sync-version.js
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          version = "0.9.1"
          init = Path("src/djobs/__init__.py").read_text(encoding="utf-8")
          assert re.search(rf'__version__\s*=\s*["\']{re.escape(version)}["\']', init)
          assert f"## [{version}] - 2026-07-19" in Path("CHANGELOG.md").read_text(encoding="utf-8")
          assert json.loads(Path("vscode-ext/package.json").read_text())["version"] == version
          lock = json.loads(Path("vscode-ext/package-lock.json").read_text())
          assert lock["version"] == version
          assert lock["packages"][""]["version"] == version
          server = json.loads(Path("server.json").read_text())
          assert server["version"] == version
          assert all(item["version"] == version for item in server["packages"])
          PY
          git diff --check

      - name: Commit prepared release
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md src/djobs/__init__.py vscode-ext/package.json vscode-ext/package-lock.json server.json .github/workflows/prepare-release-0.9.1.yml
          git commit -m "Release djobs 0.9.1"
          git push origin HEAD:release/0.9.1
