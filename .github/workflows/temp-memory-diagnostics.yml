name: Temporary memory diagnostics

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/memory-diagnostics.ready"

permissions:
  contents: write

jobs:
  diagnose:
    if: github.event.pull_request.head.ref == 'feature/project-memory-core'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/project-memory-core
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e ".[dev,pg]"
      - name: Apply the repository-pinned Ruff formatter
        run: python -m ruff format --config pyproject.toml src tests
      - name: Capture complete Mypy diagnostics
        run: |
          set +e
          python -m mypy > /tmp/mypy.txt 2>&1
          echo "$?" > /tmp/mypy.status
          cat /tmp/mypy.txt
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: project-memory-mypy
          path: |
            /tmp/mypy.txt
            /tmp/mypy.status
          retention-days: 1
      - name: Commit formatter output and remove diagnostics files
        run: |
          set -euo pipefail
          rm -f .github/memory-diagnostics.ready
          rm -f .github/workflows/temp-memory-diagnostics.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: apply Ruff formatting to project memory"
          git push origin HEAD:feature/project-memory-core
