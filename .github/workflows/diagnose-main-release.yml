name: Diagnose main release

on:
  push:
    branches: [fix/release-run-failure]

permissions:
  actions: read
  contents: write
  pull-requests: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/release-run-failure
          fetch-depth: 0

      - name: Probe automated PR permission
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source_branch="automation/pr-permission-probe-${GITHUB_RUN_ID}"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin main
          git checkout -b "$source_branch" origin/main
          printf 'temporary permission probe\n' > .release-pr-permission-probe
          git add .release-pr-permission-probe
          git commit -m 'test: probe release PR permission'
          git push origin "HEAD:$source_branch"

          set +e
          output="$(gh pr create \
            --draft \
            --base main \
            --head "$source_branch" \
            --title 'test: automated release PR permission probe' \
            --body 'Temporary probe; this PR is closed automatically.' 2>&1)"
          status=$?
          set -e

          {
            echo '=== Automated PR permission probe ==='
            echo "status=$status"
            echo "$output"
          } > "$GITHUB_WORKSPACE/.release-pr-permission-probe.txt"

          if [ "$status" -eq 0 ]; then
            pr_number="$(gh pr view "$source_branch" --json number --jq .number)"
            gh pr close "$pr_number" --delete-branch
          else
            git push origin --delete "$source_branch" || true
          fi

          git checkout fix/release-run-failure

      - name: Capture latest main release runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          {
            cat .release-pr-permission-probe.txt
            echo
            echo '=== Repository workflow permissions ==='
            gh api repos/${{ github.repository }}/actions/permissions/workflow || true
            echo
            echo '=== Rules applying to main ==='
            gh api repos/${{ github.repository }}/rules/branches/main || true
            echo
            echo '=== Release runs ==='
            gh run list --workflow Release --branch main --limit 10 \
              --json databaseId,displayTitle,event,headSha,status,conclusion,createdAt,updatedAt,url
            echo
            echo '=== Latest failed Release log ==='
            failed_id="$(gh run list --workflow Release --branch main --status failure --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
            if [ -n "$failed_id" ]; then
              gh run view "$failed_id" --log-failed || true
            else
              echo 'No failed Release run found.'
            fi
            echo
            echo '=== CI runs for current main ==='
            main_sha="$(gh api repos/${{ github.repository }}/commits/main --jq .sha)"
            echo "main_sha=$main_sha"
            gh run list --workflow CI --commit "$main_sha" --limit 10 \
              --json databaseId,event,status,conclusion,createdAt,updatedAt,url
          } > .release-main-diagnostics.txt 2>&1

      - name: Commit diagnostics
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .release-main-diagnostics.txt
          git commit -m 'test: capture automated PR permission result'
          git push origin HEAD:fix/release-run-failure
