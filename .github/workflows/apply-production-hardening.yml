name: Apply production hardening

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  harden:
    if: github.head_ref == 'fix/v0.18.3-production-hardening-v2' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: vscode-ext/package-lock.json
      - name: Apply audited transformation
        shell: bash
        run: |
          git fetch origin fix/v0.18.3-production-hardening
          git show origin/fix/v0.18.3-production-hardening:.github/workflows/apply-v0183-hardening.yml > /tmp/source.yml
          python - <<'PY'
          from pathlib import Path
          import textwrap

          source = Path('/tmp/source.yml').read_text(encoding='utf-8')
          start = "          cat > /tmp/apply_hardening.py <<'PY'\n"
          end = "\n          PY\n          python /tmp/apply_hardening.py"
          block = textwrap.dedent(source.split(start, 1)[1].split(end, 1)[0])
          block = block.replace(
              'tests/unit/test_cross_agent_lifecycle.py',
              'tests/unit/test_lifecycle.py',
          )
          Path('/tmp/apply_hardening.py').write_text(block, encoding='utf-8')
          PY
          python /tmp/apply_hardening.py

          # Normalize two defects in the generated capsule helper before validation:
          # it was nested one scope too deep, and reused an integer loop variable
          # for a later Optional[int] tuple field.
          python - <<'PY'
          from pathlib import Path

          path = Path('src/djobs/observations.py')
          lines = path.read_text(encoding='utf-8').splitlines()
          start = next(
              line_index
              for line_index, line in enumerate(lines)
              if line.lstrip().startswith('def _metadata_json(')
          )
          end = next(
              line_index
              for line_index in range(start + 1, len(lines))
              if lines[line_index].startswith('def _memory_status(')
          )
          indent = len(lines[start]) - len(lines[start].lstrip())
          if indent <= 0:
              raise RuntimeError('_metadata_json was expected to require scope normalization')
          prefix = ' ' * indent
          for line_index in range(start, end):
              if lines[line_index].startswith(prefix):
                  lines[line_index] = lines[line_index][indent:]
              elif lines[line_index].strip():
                  raise RuntimeError(
                      'inconsistent indentation while normalizing _metadata_json '
                      f'at line {line_index + 1}'
                  )
          text = '\n'.join(lines) + '\n'
          replacements = {
              'for index, value in enumerate(values):':
                  'for item_index, value in enumerate(values):',
              'candidates.append((len(value), key, index))':
                  'candidates.append((len(value), key, item_index))',
              'length, key, index = max(candidates)':
                  'length, key, selected_index = max(candidates)',
              'if index is None:':
                  'if selected_index is None:',
              'capsule[key][index] = clean(capsule[key][index], new_limit)':
                  'capsule[key][selected_index] = clean('
                  'capsule[key][selected_index], new_limit)',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise RuntimeError(f'expected capsule helper snippet missing: {old}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY

          # The old guard asserted the release-PR-only optimization. The hardened
          # contract is now that every PR runs the real gates.
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/unit/test_release_surfaces.py')
          text = path.read_text(encoding='utf-8')
          old = '    assert "automation/release-v" in ci\n'
          new = (
              '    assert \'FULL_CI: "true"\' in ci\n'
              '    assert "if: github.event_name != \'pull_request\'" not in ci\n'
              '    assert "test-postgres:" in ci\n'
              '    assert "installed-smoke:" in ci\n'
          )
          if old not in text:
              raise RuntimeError('expected release-surface CI assertion is missing')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

          # Calibrate all public documentation as a skeptical user would read it.
          # Keep benchmark numbers reproducible, but never turn the synthetic
          # reread baseline into a provider-token or product-quality claim.
          python - <<'PY'
          from pathlib import Path


          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding='utf-8')
              if old not in text:
                  raise RuntimeError(f'expected documentation block missing from {path}: {old[:80]!r}')
              target.write_text(text.replace(old, new, 1), encoding='utf-8')


          def append_once(path: str, marker: str, block: str) -> None:
              target = Path(path)
              text = target.read_text(encoding='utf-8')
              if marker not in text:
                  target.write_text(text.rstrip() + '\n\n' + block.strip() + '\n', encoding='utf-8')


          replace_once(
              'README.md',
              """A healthy first run does **not** require a project-local `.vscode/mcp.json`. The extension and
`djobs setup` use user-level registration, while the shared local database is created on first use.
""",
              """A healthy first run does **not** require a project-local `.vscode/mcp.json`. `djobs setup`
explicitly configures user-level host adapters. The VS Code extension can register MCP natively and,
on the first MCP call, may create `~/.djobs/global.db` and configure the detected Copilot adapter.
Those are local user-level changes rather than a read-only probe; use `djobs doctor` to inspect them
and `djobs remove copilot` to remove the managed adapter.
""",
          )
          replace_once(
              'README.md',
              '| `djobs gain` | Inspect recovery savings and verified-task efficiency |',
              '| `djobs gain` | Inspect heuristic recovery and verified-task efficiency estimates |',
          )
          replace_once(
