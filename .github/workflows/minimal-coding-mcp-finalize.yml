name: Minimal Coding MCP Finalizer

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    if: github.head_ref == 'refactor/minimal-coding-mcp' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/minimal-coding-mcp
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Apply minimal MCP migration
        id: migrate
        continue-on-error: true
        run: python tools/apply_minimal_coding_mcp.py > minimal-mcp-migration.txt 2>&1

      - name: Upload migration report
        if: steps.migrate.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: minimal-mcp-migration
          path: minimal-mcp-migration.txt

      - name: Stop after migration failure
        if: steps.migrate.outcome == 'failure'
        run: |
          cat minimal-mcp-migration.txt
          exit 1

      - name: Remove migration script
        run: rm tools/apply_minimal_coding_mcp.py

      - name: Validate manifests and diff
        run: |
          python -m json.tool server.json >/dev/null
          python -m json.tool .vscode/mcp.json >/dev/null
          python -m json.tool vscode-ext/package.json >/dev/null
          python -m json.tool vscode-ext/package-lock.json >/dev/null
          git diff --check

      - name: Use minimum supported Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install package and development dependencies
        run: |
          python --version
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev,pg]'

      - name: Normalize Python files
        run: |
          ruff format src/ tests/
          ruff check --fix src/ tests/

      - name: Validate Python implementation
        id: validate_python
        continue-on-error: true
        run: |
          set +e
          status=0
          {
            echo '=== compileall ==='
            python -m compileall -q src tests || status=$?
            echo '=== ruff check ==='
            ruff check src/ tests/ || status=$?
            echo '=== ruff format ==='
            ruff format --check src/ tests/ || status=$?
            echo '=== mypy ==='
            mypy || status=$?
            echo '=== pytest ==='
            pytest -q --tb=short || status=$?
          } > minimal-mcp-python-validation.txt 2>&1
          exit "$status"

      - name: Upload Python validation report
        if: steps.validate_python.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: minimal-mcp-python-validation
          path: minimal-mcp-python-validation.txt

      - name: Stop after Python validation failure
        if: steps.validate_python.outcome == 'failure'
        run: |
          cat minimal-mcp-python-validation.txt
          exit 1

      - name: Validate extension
        working-directory: vscode-ext
        run: |
          npm ci
          npx tsc -p ./ --noEmit
          npm run compile

      - name: Guard minimal and full entrypoints
        run: |
          grep -q 'djobs-mcp = "djobs.coding_mcp:main"' pyproject.toml
          grep -q 'djobs-mcp-full = "djobs.delta_mcp:main"' pyproject.toml
          grep -q '"djobs.coding_mcp"' .vscode/mcp.json
          ! grep -q '"claim_task"' .vscode/mcp.json
          pytest -q tests/unit/test_minimal_coding_mcp.py

      - name: Commit finalized implementation
        run: |
          rm -f minimal-mcp-*.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor: minimize default coding MCP tool surface'
          git push origin HEAD:refactor/minimal-coding-mcp
