name: Apply production hardening

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  harden:
    if: github.head_ref == 'fix/v0.18.3-production-hardening-v2' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: vscode-ext/package-lock.json
      - name: Apply audited transformation
        shell: bash
        run: |
          git fetch origin fix/v0.18.3-production-hardening
          git show origin/fix/v0.18.3-production-hardening:.github/workflows/apply-v0183-hardening.yml > /tmp/source.yml
          python - <<'PY'
          from pathlib import Path
          import textwrap

          source = Path('/tmp/source.yml').read_text(encoding='utf-8')
          start = "          cat > /tmp/apply_hardening.py <<'PY'\n"
          end = "\n          PY\n          python /tmp/apply_hardening.py"
          block = textwrap.dedent(source.split(start, 1)[1].split(end, 1)[0])
          block = block.replace(
              'tests/unit/test_cross_agent_lifecycle.py',
              'tests/unit/test_lifecycle.py',
          )
          Path('/tmp/apply_hardening.py').write_text(block, encoding='utf-8')
          PY
          python /tmp/apply_hardening.py

          python - <<'PY'
          from pathlib import Path

          path = Path('src/djobs/observations.py')
          lines = path.read_text(encoding='utf-8').splitlines()
          start = next(
              line_index
              for line_index, line in enumerate(lines)
              if line.lstrip().startswith('def _metadata_json(')
          )
          end = next(
              line_index
              for line_index in range(start + 1, len(lines))
              if lines[line_index].startswith('def _memory_status(')
          )
          indent = len(lines[start]) - len(lines[start].lstrip())
          if indent <= 0:
              raise RuntimeError('_metadata_json was expected to require scope normalization')
          prefix = ' ' * indent
          for line_index in range(start, end):
              if lines[line_index].startswith(prefix):
                  lines[line_index] = lines[line_index][indent:]
              elif lines[line_index].strip():
                  raise RuntimeError(
                      'inconsistent indentation while normalizing _metadata_json '
                      f'at line {line_index + 1}'
                  )
          text = '\n'.join(lines) + '\n'
          replacements = {
              'for index, value in enumerate(values):':
                  'for item_index, value in enumerate(values):',
              'candidates.append((len(value), key, index))':
                  'candidates.append((len(value), key, item_index))',
              'length, key, index = max(candidates)':
                  'length, key, selected_index = max(candidates)',
              'if index is None:':
                  'if selected_index is None:',
              'capsule[key][index] = clean(capsule[key][index], new_limit)':
                  'capsule[key][selected_index] = clean('
                  'capsule[key][selected_index], new_limit)',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise RuntimeError(f'expected capsule helper snippet missing: {old}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY

          python - <<'PY'
          from pathlib import Path

          path = Path('tests/unit/test_release_surfaces.py')
          text = path.read_text(encoding='utf-8')
          old = '    assert "automation/release-v" in ci\n'
          new = (
              '    assert \'FULL_CI: "true"\' in ci\n'
              '    assert "if: github.event_name != \'pull_request\'" not in ci\n'
              '    assert "test-postgres:" in ci\n'
              '    assert "installed-smoke:" in ci\n'
          )
          if old not in text:
              raise RuntimeError('expected release-surface CI assertion is missing')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

          python .github/scripts/calibrate_hardening_docs.py
      - name: Validate and commit
        shell: bash
        run: |
          ORIGINAL_HEAD=$(git rev-parse HEAD)
          diagnose() {
            code=$?
            trap - ERR
            set +e
            git reset --mixed "$ORIGINAL_HEAD"
            {
              printf 'run_id=%s\n' "$GITHUB_RUN_ID"
              printf 'original_head=%s\n' "$ORIGINAL_HEAD"
              printf 'exit_code=%s\n\n' "$code"
              echo 'git status:'
              git status --short
              echo
              echo 'working-tree diff check:'
              git diff --check || true
              echo
              echo 'cached diff check:'
              git diff --cached --check || true
              echo
              echo 'preflight output:'
              cat /tmp/preflight-output.txt 2>/dev/null || true
            } > HARDENING_DIAGNOSTIC.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add HARDENING_DIAGNOSTIC.txt
            git commit --allow-empty -m "chore: capture hardening diagnostic"
            git push origin "HEAD:${{ github.head_ref }}"
            exit "$code"
          }
          trap diagnose ERR
          set -Eeuo pipefail

          python -m pip install -e ".[dev,pg]"
          python -m ruff format src tests scripts/prepare_auto_release.py scripts/extract_release_notes.py scripts/preflight.py
          python scripts/preflight.py --profile full --check --base-ref origin/main > /tmp/preflight-output.txt 2>&1

          rm -f HARDENING_DIAGNOSTIC.txt
          rm .github/scripts/calibrate_hardening_docs.py
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: harden memory recovery and calibrate documentation"
          git push origin "HEAD:${{ github.head_ref }}"