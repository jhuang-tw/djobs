<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 640" width="920" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
    <marker id="arrowB" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#0d9488"/>
    </marker>
    <marker id="arrowA" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#7c3aed"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="460" y="36" text-anchor="middle" font-size="24" font-weight="700" fill="#0f172a">djobs — Two Standard Usage Modes</text>
  <text x="460" y="60" text-anchor="middle" font-size="14" fill="#64748b">One SQLite queue, two ways to drive it</text>

  <!-- ================= MODE A ================= -->
  <rect x="30" y="88" width="410" height="300" rx="12" fill="#faf5ff" stroke="#c084fc" stroke-width="1.5"/>
  <text x="50" y="118" font-size="17" font-weight="700" fill="#7c3aed">Mode A · Manual / Agent</text>
  <text x="50" y="140" font-size="12.5" fill="#6b21a8">The AI agent calls MCP tools step by step. djobs only</text>
  <text x="50" y="157" font-size="12.5" fill="#6b21a8">remembers; the agent does the work — hence "call to act".</text>

  <rect x="60" y="178" width="160" height="40" rx="8" fill="#fff" stroke="#a855f7" stroke-width="1.5"/>
  <text x="140" y="203" text-anchor="middle" font-size="13" font-weight="600" fill="#6b21a8">enqueue_task()</text>

  <line x1="140" y1="218" x2="140" y2="246" stroke="#7c3aed" stroke-width="1.6" marker-end="url(#arrowA)"/>

  <rect x="60" y="248" width="160" height="40" rx="8" fill="#fff" stroke="#a855f7" stroke-width="1.5"/>
  <text x="140" y="266" text-anchor="middle" font-size="12.5" font-weight="600" fill="#6b21a8">agent does the work</text>
  <text x="140" y="281" text-anchor="middle" font-size="11" fill="#9333ea">(edit files / run cmds)</text>

  <line x1="140" y1="288" x2="140" y2="316" stroke="#7c3aed" stroke-width="1.6" marker-end="url(#arrowA)"/>

  <rect x="60" y="318" width="160" height="40" rx="8" fill="#fff" stroke="#a855f7" stroke-width="1.5"/>
  <text x="140" y="343" text-anchor="middle" font-size="13" font-weight="600" fill="#6b21a8">complete_task()</text>

  <!-- side note A -->
  <rect x="244" y="178" width="172" height="180" rx="8" fill="#fff" stroke="#e9d5ff" stroke-width="1.2"/>
  <text x="258" y="200" font-size="12" font-weight="700" fill="#7c3aed">Inspect / Recover anytime</text>
  <text x="258" y="222" font-size="11.5" fill="#6b21a8">check_task(id)</text>
  <text x="258" y="240" font-size="11.5" fill="#6b21a8">list_tasks()</text>
  <text x="258" y="258" font-size="11.5" fill="#6b21a8">resume_session(ws)</text>
  <line x1="258" y1="270" x2="402" y2="270" stroke="#e9d5ff"/>
  <text x="258" y="292" font-size="11" fill="#9333ea">After a crash / reopen:</text>
  <text x="258" y="309" font-size="11" fill="#9333ea">resume_session brings</text>
  <text x="258" y="326" font-size="11" fill="#9333ea">back all unfinished</text>
  <text x="258" y="343" font-size="11" fill="#9333ea">tasks — no progress lost.</text>

  <!-- ================= MODE B ================= -->
  <rect x="480" y="88" width="410" height="300" rx="12" fill="#f0fdfa" stroke="#5eead4" stroke-width="1.5"/>
  <text x="500" y="118" font-size="17" font-weight="700" fill="#0d9488">Mode B · Automatic Worker</text>
  <text x="500" y="140" font-size="12.5" fill="#115e59">Register a handler (how to do it), start a worker pool,</text>
  <text x="500" y="157" font-size="12.5" fill="#115e59">and it auto-polls, runs, and completes — you just enqueue.</text>

  <rect x="510" y="178" width="180" height="38" rx="8" fill="#fff" stroke="#14b8a6" stroke-width="1.5"/>
  <text x="600" y="202" text-anchor="middle" font-size="12.5" font-weight="600" fill="#115e59">registry.register(type, fn)</text>

  <line x1="600" y1="216" x2="600" y2="240" stroke="#0d9488" stroke-width="1.6" marker-end="url(#arrowB)"/>

  <rect x="510" y="242" width="180" height="38" rx="8" fill="#fff" stroke="#14b8a6" stroke-width="1.5"/>
  <text x="600" y="266" text-anchor="middle" font-size="12.5" font-weight="600" fill="#115e59">WorkerPool.run_loop()</text>

  <line x1="600" y1="280" x2="600" y2="304" stroke="#0d9488" stroke-width="1.6" marker-end="url(#arrowB)"/>

  <rect x="510" y="306" width="180" height="52" rx="8" fill="#ccfbf1" stroke="#14b8a6" stroke-width="1.5"/>
  <text x="600" y="328" text-anchor="middle" font-size="12.5" font-weight="700" fill="#115e59">auto: claim → run</text>
  <text x="600" y="346" text-anchor="middle" font-size="12.5" font-weight="700" fill="#115e59">→ complete / retry</text>

  <!-- side note B -->
  <rect x="712" y="178" width="158" height="180" rx="8" fill="#fff" stroke="#99f6e4" stroke-width="1.2"/>
  <text x="726" y="200" font-size="12" font-weight="700" fill="#0d9488">Built-in safety</text>
  <text x="726" y="222" font-size="11.5" fill="#115e59">• auto retry on fail</text>
  <text x="726" y="240" font-size="11.5" fill="#115e59">• lease + heartbeat</text>
  <text x="726" y="258" font-size="11.5" fill="#115e59">• worker dies → task</text>
  <text x="740" y="275" font-size="11.5" fill="#115e59">is re-claimed</text>
  <text x="726" y="297" font-size="11.5" fill="#115e59">• multiple agents</text>
  <text x="740" y="314" font-size="11.5" fill="#115e59">share one queue</text>
  <text x="726" y="338" font-size="11" fill="#0d9488">enqueue and leave it —</text>
  <text x="726" y="353" font-size="11" fill="#0d9488">no manual calls</text>

  <!-- ================= shared store ================= -->
  <rect x="300" y="430" width="320" height="70" rx="12" fill="#1e293b"/>
  <text x="460" y="463" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">SQLite Queue (persistent state)</text>
  <text x="460" y="484" text-anchor="middle" font-size="11.5" fill="#94a3b8">jobs · events · leases — crash-safe, inspectable, resumable</text>

  <line x1="180" y1="388" x2="360" y2="430" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="600" y1="388" x2="560" y2="430" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- lifecycle -->
  <text x="460" y="540" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Task Lifecycle</text>
  <g font-size="12" font-weight="600">
    <rect x="150" y="556" width="92" height="34" rx="17" fill="#e2e8f0"/>
    <text x="196" y="578" text-anchor="middle" fill="#334155">pending</text>
    <line x1="242" y1="573" x2="270" y2="573" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
    <rect x="272" y="556" width="92" height="34" rx="17" fill="#dbeafe"/>
    <text x="318" y="578" text-anchor="middle" fill="#1e40af">running</text>
    <line x1="364" y1="573" x2="392" y2="573" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
    <rect x="394" y="556" width="100" height="34" rx="17" fill="#dcfce7"/>
    <text x="444" y="578" text-anchor="middle" fill="#166534">succeeded</text>
    <line x1="318" y1="590" x2="318" y2="610" stroke="#475569" stroke-width="1.3" marker-end="url(#arrow)"/>
    <rect x="520" y="556" width="110" height="34" rx="17" fill="#fef3c7"/>
    <text x="575" y="578" text-anchor="middle" fill="#92400e">retry_scheduled</text>
    <line x1="494" y1="573" x2="518" y2="573" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
    <rect x="272" y="610" width="92" height="28" rx="14" fill="#fee2e2"/>
    <text x="318" y="629" text-anchor="middle" fill="#991b1b" font-size="11">failed</text>
    <rect x="660" y="556" width="92" height="34" rx="17" fill="#fef3c7"/>
    <text x="706" y="578" text-anchor="middle" fill="#92400e" font-size="11">back to pending</text>
    <line x1="630" y1="573" x2="658" y2="573" stroke="#475569" stroke-width="1.3" marker-end="url(#arrow)"/>
  </g>
</svg>
