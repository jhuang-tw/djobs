[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "djobs"
dynamic = ["version"]
description = "Local project memory that helps coding agents continue work across AI sessions."
requires-python = ">=3.10"
license = "MIT"
readme = "README.md"
keywords = ["ai-agent", "coding-agent", "local-agent-memory", "repository-memory", "cross-agent-handoff", "passive-hooks", "context-recovery", "resumable-workflow", "mcp", "model-context-protocol", "copilot", "claude-code", "codex", "gemini", "kimi-code", "multi-agent", "workflow-state", "sqlite"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Environment :: Console",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: System :: Distributed Computing",
]

dependencies = [
    "mcp[cli]>=1.0,<2",
]

[project.urls]
Homepage = "https://jhuang-tw.github.io/djobs/"
Repository = "https://github.com/jhuang-tw/djobs"
Documentation = "https://jhuang-tw.github.io/djobs/"
Issues = "https://github.com/jhuang-tw/djobs/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "PyYAML>=6.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "pre-commit>=3.5",
]
pg = [
    "psycopg[binary]>=3.1",
]

[project.scripts]
djobs = "djobs.entrypoint:main"
djobs-mcp = "djobs.coding_mcp:main"
djobs-mcp-full = "djobs.delta_mcp:main"

[tool.hatch.version]
path = "src/djobs/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/djobs"]

[tool.hatch.build.targets.sdist]
include = [
    "src/djobs",
    "migrations",
    "README.md",
    "CHANGELOG.md",
    "LICENSE",
    "pyproject.toml",
]
exclude = [
    "vscode-ext",
    ".gitignore",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
src = ["src", "tests"]
target-version = "py310"
line-length = 99

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]

[tool.mypy]
python_version = "3.10"
files = ["src/djobs"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
