name: Final audit corrections

# One-shot validation for the final skeptical-user review; removed after success.
on:
  push:
    branches: [fix/v0.18.3-production-hardening-v2]

permissions:
  contents: write

jobs:
  correct:
    if: github.ref == 'refs/heads/fix/v0.18.3-production-hardening-v2' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v0.18.3-production-hardening-v2
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Apply final corrections
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path


          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding='utf-8')
              if old not in text:
                  raise RuntimeError(f'expected final-audit snippet missing from {path}: {old!r}')
              target.write_text(text.replace(old, new, 1), encoding='utf-8')


          replace_once(
              'src/djobs/observations.py',
              '_MAX_CAPSULE_METADATA = 2400',
              '_MAX_CAPSULE_METADATA = 3200',
          )
          replace_once(
              'src/djobs/observations.py',
              'progress_values[-3:]',
              'progress_values[-5:]',
          )
          replace_once(
              'src/djobs/observations.py',
              'failure_values[-2:]',
              'failure_values[-3:]',
          )
          replace_once(
              'src/djobs/observations.py',
              'source_values[-8:]',
              'source_values[-20:]',
          )

          replace_once(
              'src/djobs/gain.py',
              'f"  {day[\'date\']}  {_format_tokens(day[\'estimated_saved_tokens\']):>9} saved  "',
              'f"  {day[\'date\']}  {_format_tokens(day[\'estimated_saved_tokens\']):>9} heuristic delta  "',
          )
          replace_once(
              'src/djobs/gain.py',
              'print("\\nRecent savings history")',
              'print("\\nRecent heuristic history")',
          )
          replace_once(
              'src/djobs/gain.py',
              'saved = record["estimated_saved_tokens"]',
              'delta = record["estimated_saved_tokens"]',
          )
          replace_once(
              'src/djobs/gain.py',
              'f"{_format_tokens(saved):>8}  {record[\'status\']:<13} {record[\'label\']}"',
              'f"{_format_tokens(delta):>8}  {record[\'status\']:<13} {record[\'label\']}"',
          )
          replace_once(
              'src/djobs/gain.py',
              '"context protected"',
              '"estimated compact context stored"',
          )

          replace_once(
              'tests/unit/test_lifecycle.py',
              '    assert isinstance(metadata["progress"], list)\n'
              '    assert isinstance(metadata["failures"], list)\n'
              '    assert "next" in metadata\n'
              '    assert isinstance(metadata["source_event_ids"], list)\n'
              '    assert metadata["truncated_fields"]\n',
              '    assert isinstance(metadata["progress"], list)\n'
              '    assert len(metadata["progress"]) == 5\n'
              '    assert isinstance(metadata["failures"], list)\n'
              '    assert len(metadata["failures"]) == 3\n'
              '    assert "next" in metadata\n'
              '    assert isinstance(metadata["source_event_ids"], list)\n'
              '    assert len(metadata["source_event_ids"]) == 14\n'
              '    assert "truncated_fields" not in metadata\n',
          )

          replace_once(
              'tests/unit/test_gain.py',
              '"""Tests for explainable djobs token-savings analytics."""',
              '"""Tests for explainable djobs context heuristics."""',
          )
          test_path = Path('tests/unit/test_gain.py')
          test_text = test_path.read_text(encoding='utf-8')
          marker = 'def test_gain_table_uses_heuristic_language'
          if marker not in test_text:
              test_text = test_text.rstrip() + r'''


def test_gain_table_uses_heuristic_language(
    tmp_path: Path,
    capsys: pytest.CaptureFixture[str],
) -> None:
    db = tmp_path / "gain.db"
    _, queue = _queue(db)
    job = queue.submit(
        "task",
        {"summary": "Calibrate public metrics"},
        correlation_id="workspace-language",
    )
    queue.complete(job.id, evidence="done")

    assert (
        main(
            [
                "--db",
                str(db),
                "--correlation-id",
                "workspace-language",
                "--daily",
                "--history",
            ]
        )
        == 0
    )

    output = capsys.readouterr().out.casefold()
    assert "heuristic delta" in output
    assert "recent heuristic history" in output
    assert "savings history" not in output
    assert " saved  " not in output
''' + '\n'
              test_path.write_text(test_text, encoding='utf-8')
          PY

          python -m pip install -e ".[dev,pg]"
          python -m ruff format src tests
          python -m ruff check src tests
          python -m mypy
          python -m pytest -q --tb=short \
            tests/unit/test_gain.py \
            tests/unit/test_lifecycle.py \
            tests/unit/test_project_memory_benchmark.py \
            tests/unit/test_release_surfaces.py

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/djobs/observations.py src/djobs/gain.py tests/unit/test_lifecycle.py tests/unit/test_gain.py
          git diff --cached --check
          git commit -m "fix: preserve bounded capsule detail and calibrate gain output"
          git push origin "HEAD:fix/v0.18.3-production-hardening-v2"
