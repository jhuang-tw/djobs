name: Format product-focus branch

on:
  push:
    branches:
      - fix/product-focus-cli-onboarding

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/product-focus-cli-onboarding
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Format with repository-pinned Ruff
        run: |
          python -m pip install ruff==0.15.14
          python -m ruff format src/djobs/entrypoint.py
      - name: Commit formatting result
        run: |
          if git diff --quiet -- src/djobs/entrypoint.py; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/djobs/entrypoint.py
          git commit -m "style: format memory-first entrypoint"
          git push origin HEAD:fix/product-focus-cli-onboarding
