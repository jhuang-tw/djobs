name: Final local handoff validation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: final-local-handoff-${{ github.event.pull_request.head.ref }}
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python tools/_branch_fix.py
      - run: python -m pip install -e ".[dev,pg]"
      - run: python -m pip install pre-commit
      - name: Run diagnostic gates
        id: gates
        shell: bash
        run: |
          mkdir -p diagnostics
          set +e
          pytest -q --tb=short 2>&1 | tee diagnostics/pytest.log
          pytest_status=${PIPESTATUS[0]}
          pre-commit run ruff-check --all-files 2>&1 | tee diagnostics/ruff-check.log
          ruff_status=${PIPESTATUS[0]}
          pre-commit run ruff-format --all-files 2>&1 | tee diagnostics/ruff-format.log
          format_status=${PIPESTATUS[0]}
          mypy 2>&1 | tee diagnostics/mypy.log
          mypy_status=${PIPESTATUS[0]}
          git diff --check 2>&1 | tee diagnostics/diff-check.log
          diff_status=${PIPESTATUS[0]}
          printf 'pytest=%s\nruff=%s\nformat=%s\nmypy=%s\ndiff=%s\n' \
            "$pytest_status" "$ruff_status" "$format_status" "$mypy_status" "$diff_status" \
            | tee diagnostics/status.txt
          if (( pytest_status || ruff_status || format_status || mypy_status || diff_status )); then
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: final-local-handoff-diagnostics
          path: diagnostics
          if-no-files-found: error

  finalize:
    needs: diagnose
    runs-on: ubuntu-latest
    env:
      TARGET_BRANCH: ${{ github.event.pull_request.head.ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python tools/_branch_fix.py
      - run: git diff --check
      - name: Commit validated fixes and remove temporary validation files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm tools/_branch_fix.py tools/_branch_fix_trigger.txt .github/workflows/branch-fix.yml
          git add src/djobs/handoff.py CHANGELOG.md tests/unit/test_handoff_budget_priority.py
          git commit -m "[branch-fix complete] fix: finish local handoff hardening"
          git push origin HEAD:${TARGET_BRANCH}
