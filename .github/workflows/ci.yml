name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize-product:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/adoption-readiness
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Finalize automatic hooks and gain analytics
        run: python tools/finalize_auto_hook.py
      - name: Validate final product files
        run: |
          pip install -e ".[dev,pg]"
          ruff format --config pyproject.toml src tests
          ruff check --config pyproject.toml src tests
          mypy
          pytest -q --tb=short
      - name: Commit product files and restore standard CI
        run: |
          rm tools/apply_auto_hook_compat.py tools/finalize_auto_hook.py
          git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add automatic hooks and token savings analytics"
          git push origin HEAD:feat/adoption-readiness
