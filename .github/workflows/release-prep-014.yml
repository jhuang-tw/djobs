name: Prepare 0.14.0 release

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: prepare-014-${{ github.event.pull_request.head.ref }}
  cancel-in-progress: true

jobs:
  diagnose-pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python tools/_fix_prepare_release_014.py
      - run: python tools/_prepare_release_014.py
      - run: python -m pip install -e ".[dev]"
      - name: Capture pytest output
        shell: bash
        run: |
          mkdir -p diagnostics
          set +e
          pytest -q --tb=long 2>&1 | tee diagnostics/pytest.log
          status=${PIPESTATUS[0]}
          printf 'pytest=%s\n' "$status" > diagnostics/status.txt
          exit "$status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-014-pytest-diagnostics
          path: diagnostics
          if-no-files-found: error
