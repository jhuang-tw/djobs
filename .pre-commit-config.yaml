# The pre-push hook and GitHub CI call the same Python entry point. The hook
# applies the pinned formatter first and aborts when it changes files, so a
# developer fixes/stages formatting before spending time on remote CI.
#
# One-time setup per clone:
#     python -m pip install -e ".[dev,pg]"
#     pre-commit install
#
# Run on demand:
#     python scripts/preflight.py --profile quick --fix --base-ref origin/main
#
# Bypass is intentionally possible for emergencies with `git push --no-verify`,
# but CI still performs the non-mutating check form.

default_install_hook_types: [pre-push]

repos:
  - repo: local
    hooks:
      - id: djobs-preflight
        name: djobs quick preflight
        entry: python scripts/preflight.py --profile quick --fix --base-ref origin/main
        language: system
        pass_filenames: false
        always_run: true
