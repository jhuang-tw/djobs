name: Temporary verify 0.16.0 release

on:
  push:
    branches:
      - main
    paths:
      - ".github/verify-016.ready"

permissions:
  contents: write
  issues: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Verify public release surfaces
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json
          import os
          import time
          import urllib.request

          target = "0.16.0"
          repository = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]

          def get_json(url, *, data=None, headers=None):
              merged = {"User-Agent": "djobs-release-verifier"}
              if headers:
                  merged.update(headers)
              request = urllib.request.Request(url, data=data, headers=merged)
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)

          def github_version():
              try:
                  value = get_json(
                      f"https://api.github.com/repos/{repository}/releases/tags/v{target}",
                      headers={"Authorization": f"Bearer {token}"},
                  )
                  return str(value.get("tag_name", "")).removeprefix("v")
              except Exception:
                  return ""

          def pypi_version():
              try:
                  value = get_json("https://pypi.org/pypi/djobs/json")
                  return str(value.get("info", {}).get("version", ""))
              except Exception:
                  return ""

          def marketplace_version():
              try:
                  payload = json.dumps(
                      {
                          "filters": [
                              {
                                  "criteria": [
                                      {"filterType": 7, "value": "jhuang-tw.djobs"}
                                  ]
                              }
                          ],
                          "assetTypes": [],
                          "flags": 914,
                      }
                  ).encode()
                  value = get_json(
                      "https://marketplace.visualstudio.com/_apis/public/gallery/extensionquery",
                      data=payload,
                      headers={
                          "Content-Type": "application/json",
                          "Accept": "application/json;api-version=7.2-preview.1",
                      },
                  )
                  extensions = value.get("results", [{}])[0].get("extensions", [])
                  versions = extensions[0].get("versions", []) if extensions else []
                  return str(versions[0].get("version", "")) if versions else ""
              except Exception:
                  return ""

          state = {"github": "", "pypi": "", "marketplace": ""}
          for _ in range(36):
              state = {
                  "github": github_version(),
                  "pypi": pypi_version(),
                  "marketplace": marketplace_version(),
              }
              print(state, flush=True)
              if all(value == target for value in state.values()):
                  break
              time.sleep(10)

          body = (
              "RELEASE_VERIFY_0_16_0\n"
              f"GitHub Release: version={state['github'] or 'unavailable'}\n"
              f"PyPI: version={state['pypi'] or 'unavailable'}\n"
              f"VS Marketplace: version={state['marketplace'] or 'unavailable'}"
          )
          request = urllib.request.Request(
              f"https://api.github.com/repos/{repository}/issues/19/comments",
              data=json.dumps({"body": body}).encode(),
              headers={
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github+json",
                  "Content-Type": "application/json",
                  "User-Agent": "djobs-release-verifier",
              },
              method="POST",
          )
          with urllib.request.urlopen(request, timeout=30):
              pass

          if not all(value == target for value in state.values()):
              raise SystemExit(f"release surfaces did not all reach {target}: {state}")
          PY
      - name: Remove temporary verifier
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/verify-016.ready
          git rm -f .github/workflows/temp-verify-016.yml
          git commit -m "chore: remove temporary 0.16.0 verifier"
          git push origin HEAD:main
