name: Verify public 0.14.0 publication

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Poll official public APIs
        env:
          EXPECTED_VERSION: "0.14.0"
          EXPECTED_SHA: "77cb96a8f95fe3a11417859992694eeda75db197"
        run: |
          cat > /tmp/verify_release.py <<'PY'
          from __future__ import annotations

          import json
          import os
          import time
          import urllib.error
          import urllib.request
          from pathlib import Path

          version = os.environ["EXPECTED_VERSION"]
          expected_sha = os.environ["EXPECTED_SHA"]
          result: dict[str, object] = {
              "version": version,
              "expected_release_commit": expected_sha,
              "github_release": {"ok": False},
              "pypi": {"ok": False},
              "vscode_marketplace": {"ok": False},
          }

          def get_json(url: str) -> dict[str, object]:
              request = urllib.request.Request(
                  url,
                  headers={"Accept": "application/json", "User-Agent": "djobs-release-verifier"},
              )
              with urllib.request.urlopen(request, timeout=20) as response:
                  return json.load(response)

          def marketplace_json() -> dict[str, object]:
              payload = json.dumps(
                  {
                      "filters": [
                          {
                              "criteria": [
                                  {"filterType": 7, "value": "jhuang-tw.djobs"}
                              ],
                              "pageNumber": 1,
                              "pageSize": 1,
                              "sortBy": 0,
                              "sortOrder": 0,
                          }
                      ],
                      "assetTypes": [],
                      "flags": 914,
                  }
              ).encode()
              request = urllib.request.Request(
                  "https://marketplace.visualstudio.com/_apis/public/gallery/extensionquery",
                  data=payload,
                  headers={
                      "Accept": "application/json;api-version=7.2-preview.1",
                      "Content-Type": "application/json",
                      "User-Agent": "djobs-release-verifier",
                  },
                  method="POST",
              )
              with urllib.request.urlopen(request, timeout=20) as response:
                  return json.load(response)

          for attempt in range(30):
              try:
                  release = get_json(
                      f"https://api.github.com/repos/jhuang-tw/djobs/releases/tags/v{version}"
                  )
                  target = str(release.get("target_commitish", ""))
                  result["github_release"] = {
                      "ok": not bool(release.get("draft")) and not bool(release.get("prerelease")),
                      "tag": release.get("tag_name"),
                      "name": release.get("name"),
                      "published_at": release.get("published_at"),
                      "target_commitish": target,
                      "body_has_local_handoff": "Local cross-agent handoff"
                      in str(release.get("body", "")),
                  }
              except Exception as exc:
                  result["github_release"] = {"ok": False, "error": repr(exc)}

              try:
                  pypi = get_json(f"https://pypi.org/pypi/djobs/{version}/json")
                  urls = pypi.get("urls", [])
                  result["pypi"] = {
                      "ok": pypi.get("info", {}).get("version") == version and bool(urls),
                      "version": pypi.get("info", {}).get("version"),
                      "summary": pypi.get("info", {}).get("summary"),
                      "requires_python": pypi.get("info", {}).get("requires_python"),
                      "files": [item.get("filename") for item in urls],
                      "trusted_publishing": all(
                          bool(item.get("provenance")) or bool(item.get("attestations"))
                          for item in urls
                      ) if urls else False,
                  }
              except Exception as exc:
                  result["pypi"] = {"ok": False, "error": repr(exc)}

              try:
                  gallery = marketplace_json()
                  extensions = gallery.get("results", [{}])[0].get("extensions", [])
                  extension = extensions[0] if extensions else {}
                  versions = extension.get("versions", [])
                  latest = versions[0] if versions else {}
                  result["vscode_marketplace"] = {
                      "ok": latest.get("version") == version,
                      "version": latest.get("version"),
                      "display_name": extension.get("displayName"),
                      "short_description": extension.get("shortDescription"),
                      "publisher": extension.get("publisher", {}).get("publisherName"),
                  }
              except Exception as exc:
                  result["vscode_marketplace"] = {"ok": False, "error": repr(exc)}

              Path("publication-verification.json").write_text(
                  json.dumps(result, indent=2, ensure_ascii=False) + "\n",
                  encoding="utf-8",
              )
              if all(
                  bool(result[key].get("ok"))
                  for key in ("github_release", "pypi", "vscode_marketplace")
              ):
                  print(json.dumps(result, indent=2, ensure_ascii=False))
                  raise SystemExit(0)
              if attempt < 29:
                  time.sleep(10)

          print(json.dumps(result, indent=2, ensure_ascii=False))
          raise SystemExit(1)
          PY
          python /tmp/verify_release.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: publication-verification-014
          path: publication-verification.json
          if-no-files-found: error
