name: Public Surface Finalizer

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    if: github.head_ref == 'chore/public-surface-cleanup' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/public-surface-cleanup
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Apply cleanup
        run: python tools/apply_public_surface_cleanup.py

      - name: Remove one-shot migration machinery
        run: |
          rm tools/apply_public_surface_cleanup.py
          rm .github/workflows/public-surface-finalize.yml

      - name: Validate manifests
        run: |
          python -m json.tool server.json >/dev/null
          python -m json.tool vscode-ext/package.json >/dev/null
          python -m json.tool vscode-ext/package-lock.json >/dev/null

      - name: Install Python development dependencies
        run: pip install -e '.[dev,pg]'

      - name: Validate Python
        run: |
          ruff check src/ tests/
          ruff format --check src/ tests/
          mypy
          pytest -q --tb=short

      - name: Validate VS Code extension
        working-directory: vscode-ext
        run: |
          npm ci
          npx tsc -p ./ --noEmit
          npm run compile

      - name: Scan removed references
        id: references
        continue-on-error: true
        run: |
          git grep -n -E 'docs/(INTERNALS|ARCHITECTURE|ROADMAP|HANDOFF|IMPLEMENTATION_NOTES|CONTEXT_EFFICIENCY)\.md|\.github/agents/durable-coder\.agent\.md|\.github/skills/djobs-development/SKILL\.md' -- ':!CHANGELOG.md' > removed-reference-report.txt || true
          cat removed-reference-report.txt
          test ! -s removed-reference-report.txt

      - name: Upload removed reference report
        if: steps.references.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: removed-reference-report
          path: removed-reference-report.txt
          if-no-files-found: error

      - name: Stop after removed reference failure
        if: steps.references.outcome == 'failure'
        run: exit 1

      - name: Commit finalized cleanup
        run: |
          rm -f removed-reference-report.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs: consolidate public product surfaces'
          git push origin HEAD:chore/public-surface-cleanup
