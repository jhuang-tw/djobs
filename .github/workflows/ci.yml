name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  format-context-compiler:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.ref == 'feat/context-compiler-017' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install ruff==0.15.14
      - name: Apply safe Ruff fixes
        run: |
          ruff check --fix --config pyproject.toml src tests scripts/benchmark_resume_quality.py || true
          ruff format --config pyproject.toml src tests scripts/benchmark_resume_quality.py
      - name: Capture remaining diagnostics
        run: |
          python -m pip install -e ".[dev,pg]"
          ruff check --config pyproject.toml src tests scripts/benchmark_resume_quality.py > .github/context-compiler-ruff.txt 2>&1 || true
          mypy > .github/context-compiler-mypy.txt 2>&1 || true
      - name: Commit formatting and diagnostics
        run: |
          if git diff --quiet && git ls-files --error-unmatch .github/context-compiler-ruff.txt .github/context-compiler-mypy.txt >/dev/null 2>&1; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src tests scripts/benchmark_resume_quality.py .github/context-compiler-ruff.txt .github/context-compiler-mypy.txt
          git commit -m 'style: apply context compiler formatting'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # Use the same pinned ruff version as the local pre-push hook
      # (.pre-commit-config.yaml) so local and CI can never drift.
      - run: pip install pre-commit
      - run: pre-commit run ruff-check --all-files
      - run: pre-commit run ruff-format --all-files

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev,pg]"
      - run: mypy

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: pytest -q --tb=short

  test-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: djobs
          POSTGRES_PASSWORD: djobs
          POSTGRES_DB: djobs
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U djobs"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DJOBS_TEST_PG_DSN: postgresql://djobs:djobs@localhost:5432/djobs
      DJOBS_REQUIRE_PG: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev,pg]"
      - name: Run tests against PostgreSQL backend
        run: pytest -q --tb=short tests/integration/test_repository_contract.py

  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: vscode-ext/package-lock.json
      - run: npm ci
        working-directory: vscode-ext
      - run: npx tsc -p ./ --noEmit
        working-directory: vscode-ext
      - run: npm run compile
        working-directory: vscode-ext

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/
          if-no-files-found: error

  installed-smoke:
    needs: package
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist
      - run: python scripts/smoke_install.py --wheel dist
