name: Prepare 0.14.0 release

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: prepare-014-${{ github.event.pull_request.head.ref }}
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: vscode-ext/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python tools/_prepare_release_014.py
      - run: python -m pip install -e ".[dev,pg]"
      - run: python -m pip install --upgrade build twine
      - name: Capture all gate output
        shell: bash
        run: |
          mkdir -p diagnostics
          set +e
          pytest -q --tb=short 2>&1 | tee diagnostics/pytest.log
          pytest_status=${PIPESTATUS[0]}
          python -m ruff format src tests 2>&1 | tee diagnostics/ruff-format.log
          format_status=${PIPESTATUS[0]}
          python -m ruff check src tests 2>&1 | tee diagnostics/ruff-check.log
          ruff_status=${PIPESTATUS[0]}
          mypy 2>&1 | tee diagnostics/mypy.log
          mypy_status=${PIPESTATUS[0]}
          python -m build 2>&1 | tee diagnostics/build.log
          build_status=${PIPESTATUS[0]}
          python -m twine check dist/* 2>&1 | tee diagnostics/twine.log
          twine_status=${PIPESTATUS[0]}
          (cd vscode-ext && npm ci && npx tsc -p ./ --noEmit && npm run compile) 2>&1 | tee diagnostics/vscode.log
          vscode_status=${PIPESTATUS[0]}
          git diff --check 2>&1 | tee diagnostics/diff-check.log
          diff_status=${PIPESTATUS[0]}
          printf 'pytest=%s\nformat=%s\nruff=%s\nmypy=%s\nbuild=%s\ntwine=%s\nvscode=%s\ndiff=%s\n' \
            "$pytest_status" "$format_status" "$ruff_status" "$mypy_status" \
            "$build_status" "$twine_status" "$vscode_status" "$diff_status" \
            | tee diagnostics/status.txt
          if (( pytest_status || format_status || ruff_status || mypy_status || build_status || twine_status || vscode_status || diff_status )); then
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-014-diagnostics
          path: diagnostics
          if-no-files-found: error
