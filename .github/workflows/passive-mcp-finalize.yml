name: Passive MCP Finalizer

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    if: github.head_ref == 'refactor/remove-mcp-daemon' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/remove-mcp-daemon
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Apply passive MCP cleanup
        run: python tools/apply_passive_mcp.py

      - name: Remove one-shot migration machinery
        run: |
          rm tools/apply_passive_mcp.py
          rm .github/workflows/passive-mcp-finalize.yml

      - name: Validate manifests
        run: |
          python -m json.tool server.json >/dev/null
          python -m json.tool vscode-ext/package.json >/dev/null
          python -m json.tool vscode-ext/package-lock.json >/dev/null
          git diff --check

      - name: Install Python dependencies
        run: pip install -e '.[dev,pg]'

      - name: Validate Python
        run: |
          ruff check src/ tests/
          ruff format --check src/ tests/
          mypy
          pytest -q --tb=short

      - name: Validate extension version surface
        working-directory: vscode-ext
        run: |
          npm ci
          npx tsc -p ./ --noEmit
          npm run compile

      - name: Guard passive MCP architecture
        run: |
          ! grep -R -n -E '_start_embedded_daemon|threading\.Thread|BUILTIN_HANDLERS|from djobs\.daemon import' \
            src/djobs/mcp_server.py src/djobs/low_token_mcp.py src/djobs/delta_mcp.py

      - name: Commit finalized cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor: keep coding MCP processes passive'
          git push origin HEAD:refactor/remove-mcp-daemon
