name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: automatic-release-main
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    outputs:
      release: ${{ steps.plan.outputs.release }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      release_sha: ${{ steps.commit.outputs.release_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Wait for this main commit's CI
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 180); do
            run_json="$(gh run list \
              --workflow CI \
              --commit "$TARGET_SHA" \
              --event push \
              --limit 1 \
              --json databaseId,status,conclusion \
              --jq '.[0] // empty')"

            if [ -z "$run_json" ]; then
              sleep 5
              continue
            fi

            status="$(jq -r '.status' <<<"$run_json")"
            conclusion="$(jq -r '.conclusion // ""' <<<"$run_json")"
            run_id="$(jq -r '.databaseId' <<<"$run_json")"

            if [ "$status" = "completed" ]; then
              if [ "$conclusion" != "success" ]; then
                echo "CI run $run_id completed with $conclusion" >&2
                exit 1
              fi
              echo "CI run $run_id succeeded for $TARGET_SHA"
              exit 0
            fi

            sleep 5
          done

          echo "Timed out waiting for CI on $TARGET_SHA" >&2
          exit 1

      - name: Synchronize with latest main and tags
        run: |
          set -euo pipefail
          git fetch origin main --tags --force
          git checkout -B main origin/main

      - name: Prepare next semantic version
        id: plan
        run: python scripts/prepare_auto_release.py

      - name: Validate generated release surfaces
        if: steps.plan.outputs.release == 'true' && steps.plan.outputs.changed == 'true'
        run: |
          set -euo pipefail
          python -m pip install -e ".[dev,pg]"
          ruff check src tests scripts/prepare_auto_release.py
          ruff format --check src tests scripts/prepare_auto_release.py
          mypy
          python -m pytest -q --tb=short
          git diff --check

      - name: Commit generated version and changelog
        id: commit
        env:
          RELEASE: ${{ steps.plan.outputs.release }}
          CHANGED: ${{ steps.plan.outputs.changed }}
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          set -euo pipefail
          if [ "$RELEASE" != "true" ]; then
            echo "release_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$CHANGED" = "true" ]; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add \
              CHANGELOG.md \
              src/djobs/__init__.py \
              server.json \
              vscode-ext/package.json \
              vscode-ext/package-lock.json
            git commit -m "chore(release): v${VERSION} [skip ci]"
            git push origin HEAD:main
          fi

          echo "release_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  publish-pypi:
    needs: prepare
    if: needs.prepare.outputs.release == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.release_sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Check whether PyPI already has this version
        id: existing
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          python - <<'PY'
          import os
          import urllib.error
          import urllib.request

          version = os.environ["VERSION"]
          url = f"https://pypi.org/pypi/djobs/{version}/json"
          try:
              with urllib.request.urlopen(url, timeout=20) as response:
                  exists = response.status == 200
          except urllib.error.HTTPError as exc:
              if exc.code != 404:
                  raise
              exists = False
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as stream:
              stream.write(f"exists={str(exists).lower()}\n")
          PY

      - name: Build distributions
        if: steps.existing.outputs.exists != 'true'
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*

      - name: Publish to PyPI
        if: steps.existing.outputs.exists != 'true'
        uses: pypa/gh-action-pypi-publish@release/v1

  publish-vscode:
    needs: [prepare, publish-pypi]
    if: needs.prepare.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.release_sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: vscode-ext/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: vscode-ext

      - name: Compile extension
        run: npm run compile
        working-directory: vscode-ext

      - name: Publish to VS Code Marketplace
        run: |
          set +e
          output="$(npx @vscode/vsce publish --no-dependencies 2>&1)"
          status=$?
          echo "$output"
          if [ "$status" -ne 0 ]; then
            if echo "$output" | grep -qi "already exists"; then
              echo "VS Code Marketplace version already exists; treating duplicate publish as success."
              exit 0
            fi
            exit "$status"
          fi
        working-directory: vscode-ext
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

  github-release:
    needs: [prepare, publish-pypi, publish-vscode]
    if: needs.prepare.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.release_sha }}
          fetch-depth: 0

      - name: Create and push immutable release tag
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_SHA: ${{ needs.prepare.outputs.release_sha }}
        run: |
          set -euo pipefail
          git fetch origin --tags --force
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            tagged_sha="$(git rev-list -n 1 "$TAG")"
            if [ "$tagged_sha" != "$RELEASE_SHA" ]; then
              echo "$TAG already points to $tagged_sha, expected $RELEASE_SHA" >&2
              exit 1
            fi
          else
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git tag -a "$TAG" "$RELEASE_SHA" -m "Release $TAG"
            git push origin "$TAG"
          fi

      - name: Prepare release body from CHANGELOG.md
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          awk -v version="$VERSION" '
            $0 ~ "^## \\[" version "\\] - " { in_section=1; next }
            in_section && /^## \[/ { exit }
            in_section { print }
          ' CHANGELOG.md > release_body.md
          test -s release_body.md

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ needs.prepare.outputs.release_sha }}
          body_path: release_body.md
          generate_release_notes: false
