name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: automatic-release-main
  cancel-in-progress: false

jobs:
  prepare:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.event.head_commit.message, 'chore(release):') == false
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      pull-requests: write
    outputs:
      publish: ${{ steps.release.outputs.publish }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      release_sha: ${{ steps.release.outputs.release_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Select and validate a main commit
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch origin main --tags --force
          source_sha="$(git rev-parse origin/main)"

          for attempt in $(seq 1 180); do
            run_json="$(gh run list \
              --workflow CI \
              --commit "$source_sha" \
              --event push \
              --limit 1 \
              --json databaseId,status,conclusion \
              --jq '.[0] // empty')"

            if [ -z "$run_json" ]; then
              sleep 5
              continue
            fi

            status="$(jq -r '.status' <<<"$run_json")"
            conclusion="$(jq -r '.conclusion // ""' <<<"$run_json")"
            run_id="$(jq -r '.databaseId' <<<"$run_json")"

            if [ "$status" = "completed" ]; then
              if [ "$conclusion" != "success" ]; then
                echo "CI run $run_id completed with $conclusion" >&2
                exit 1
              fi
              break
            fi

            sleep 5
          done

          if [ "${status:-}" != "completed" ]; then
            echo "Timed out waiting for CI on $source_sha" >&2
            exit 1
          fi

          git checkout -B main "$source_sha"
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "source_timestamp=$(git show -s --format=%cI HEAD)" >> "$GITHUB_OUTPUT"

      - name: Prepare next semantic version
        id: plan
        run: |
          set -euo pipefail
          release_date="$(git show -s --format=%cs HEAD)"
          python scripts/prepare_auto_release.py --date "$release_date"

      - name: Validate generated release surfaces
        if: steps.plan.outputs.release == 'true' && steps.plan.outputs.changed == 'true'
        run: |
          set -euo pipefail
          python -m pip install -e ".[dev,pg]"
          ruff check src tests scripts/prepare_auto_release.py
          ruff format --check src tests scripts/prepare_auto_release.py
          mypy
          python -m pytest -q --tb=short
          git diff --check

      - name: Create, validate, and merge release PR
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ steps.plan.outputs.release }}
          CHANGED: ${{ steps.plan.outputs.changed }}
          VERSION: ${{ steps.plan.outputs.version }}
          TAG: ${{ steps.plan.outputs.tag }}
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
          SOURCE_TIMESTAMP: ${{ steps.source.outputs.source_timestamp }}
        run: |
          set -euo pipefail

          echo "publish=false" >> "$GITHUB_OUTPUT"
          echo "release_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

          if [ "$RELEASE" != "true" ]; then
            echo "No unreleased commits were found."
            exit 0
          fi

          if [ "$CHANGED" != "true" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          release_branch="automation/release-v${VERSION}"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            CHANGELOG.md \
            src/djobs/__init__.py \
            server.json \
            vscode-ext/package.json \
            vscode-ext/package-lock.json
          GIT_AUTHOR_DATE="$SOURCE_TIMESTAMP" \
            GIT_COMMITTER_DATE="$SOURCE_TIMESTAMP" \
            git commit -m "chore(release): v${VERSION}"

          release_sha="$(git rev-parse HEAD)"
          git push --force origin "HEAD:refs/heads/${release_branch}"

          pr_number="$(gh pr list \
            --base main \
            --head "$release_branch" \
            --state open \
            --json number \
            --jq '.[0].number // empty')"

          if [ -z "$pr_number" ]; then
            gh pr create \
              --base main \
              --head "$release_branch" \
              --title "chore(release): v${VERSION}" \
              --body "Automated lockstep release for ${TAG}. This PR synchronizes Python, MCP, VS Code, lockfile, and changelog versions before publication."
            pr_number="$(gh pr view "$release_branch" --json number --jq .number)"
          fi

          gh workflow run ci.yml --ref "$release_branch"

          for attempt in $(seq 1 240); do
            run_json="$(gh run list \
              --workflow CI \
              --commit "$release_sha" \
              --event workflow_dispatch \
              --limit 1 \
              --json databaseId,status,conclusion \
              --jq '.[0] // empty')"

            if [ -z "$run_json" ]; then
              sleep 5
              continue
            fi

            status="$(jq -r '.status' <<<"$run_json")"
            conclusion="$(jq -r '.conclusion // ""' <<<"$run_json")"
            run_id="$(jq -r '.databaseId' <<<"$run_json")"

            if [ "$status" = "completed" ]; then
              if [ "$conclusion" != "success" ]; then
                echo "Release PR CI run $run_id completed with $conclusion" >&2
                exit 1
              fi
              break
            fi

            sleep 5
          done

          if [ "${status:-}" != "completed" ]; then
            echo "Timed out waiting for release PR CI on $release_sha" >&2
            exit 1
          fi

          checks_ready=false
          for attempt in $(seq 1 60); do
            set +e
            checks_output="$(gh pr checks "$pr_number" --required 2>&1)"
            checks_status=$?
            set -e
            echo "$checks_output"
            if [ "$checks_status" -eq 0 ]; then
              checks_ready=true
              break
            fi
            sleep 5
          done

          if [ "$checks_ready" != "true" ]; then
            echo "Required checks were not accepted for release PR #$pr_number" >&2
            exit 1
          fi

          current_main="$(gh api repos/${{ github.repository }}/commits/main --jq .sha)"
          if [ "$current_main" != "$SOURCE_SHA" ]; then
            echo "main advanced from $SOURCE_SHA to $current_main; a newer queued release will handle it."
            gh pr close "$pr_number" --delete-branch || true
            exit 0
          fi

          gh pr merge "$pr_number" --squash --delete-branch
          merged_sha="$(gh pr view "$pr_number" --json mergeCommit --jq .mergeCommit.oid)"

          for attempt in $(seq 1 180); do
            run_json="$(gh run list \
              --workflow CI \
              --commit "$merged_sha" \
              --event push \
              --limit 1 \
              --json databaseId,status,conclusion \
              --jq '.[0] // empty')"

            if [ -z "$run_json" ]; then
              sleep 5
              continue
            fi

            status="$(jq -r '.status' <<<"$run_json")"
            conclusion="$(jq -r '.conclusion // ""' <<<"$run_json")"
            run_id="$(jq -r '.databaseId' <<<"$run_json")"

            if [ "$status" = "completed" ]; then
              if [ "$conclusion" != "success" ]; then
                echo "Merged release CI run $run_id completed with $conclusion" >&2
                exit 1
              fi
              break
            fi

            sleep 5
          done

          if [ "${status:-}" != "completed" ]; then
            echo "Timed out waiting for merged release CI on $merged_sha" >&2
            exit 1
          fi

          echo "publish=true" >> "$GITHUB_OUTPUT"
          echo "release_sha=$merged_sha" >> "$GITHUB_OUTPUT"

  publish-pypi:
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.release_sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Check whether PyPI already has this version
        id: existing
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          python - <<'PY'
          import os
          import urllib.error
          import urllib.request

          version = os.environ["VERSION"]
          url = f"https://pypi.org/pypi/djobs/{version}/json"
          try:
              with urllib.request.urlopen(url, timeout=20) as response:
                  exists = response.status == 200
          except urllib.error.HTTPError as exc:
              if exc.code != 404:
                  raise
              exists = False
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as stream:
              stream.write(f"exists={str(exists).lower()}\n")
          PY

      - name: Build distributions
        if: steps.existing.outputs.exists != 'true'
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*

      - name: Publish to PyPI
        if: steps.existing.outputs.exists != 'true'
        uses: pypa/gh-action-pypi-publish@release/v1

  publish-vscode:
    needs: [prepare, publish-pypi]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.release_sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: vscode-ext/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: vscode-ext

      - name: Compile extension
        run: npm run compile
        working-directory: vscode-ext

      - name: Publish to VS Code Marketplace
        run: |
          set +e
          output="$(npx @vscode/vsce publish --no-dependencies 2>&1)"
          status=$?
          echo "$output"
          if [ "$status" -ne 0 ]; then
            if echo "$output" | grep -qi "already exists"; then
              echo "VS Code Marketplace version already exists; treating duplicate publish as success."
              exit 0
            fi
            exit "$status"
          fi
        working-directory: vscode-ext
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

  github-release:
    needs: [prepare, publish-pypi, publish-vscode]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.release_sha }}
          fetch-depth: 0

      - name: Prepare release body from CHANGELOG.md
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          awk -v version="$VERSION" '
            $0 ~ "^## \\[" version "\\] - " { in_section=1; next }
            in_section && /^## \\[/ { exit }
            in_section { print }
          ' CHANGELOG.md > release_body.md
          test -s release_body.md

      - name: Create or update immutable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_SHA: ${{ needs.prepare.outputs.release_sha }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            tagged_sha="$(git rev-list -n 1 "$TAG")"
            if [ "$tagged_sha" != "$RELEASE_SHA" ]; then
              echo "$TAG already points to $tagged_sha, expected $RELEASE_SHA" >&2
              exit 1
            fi
            gh release edit "$TAG" --title "$TAG" --notes-file release_body.md
          else
            gh release create "$TAG" \
              --target "$RELEASE_SHA" \
              --title "$TAG" \
              --notes-file release_body.md
          fi
