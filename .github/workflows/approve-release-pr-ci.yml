name: Approve automated release PR CI

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  actions: write
  contents: read

jobs:
  approve:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'action_required' &&
      startsWith(github.event.workflow_run.head_branch, 'automation/release-v')
    runs-on: ubuntu-latest
    steps:
      - name: Approve the gated CI run
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          gh api --method POST \
            "repos/${{ github.repository }}/actions/runs/${RUN_ID}/approve"
          echo "Approved release PR CI run ${RUN_ID}."
