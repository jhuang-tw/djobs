name: Diagnose automatic release tests

on:
  push:
    branches: [feat/automatic-release-pipeline]

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/automatic-release-pipeline
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e ".[dev,pg]"
      - name: Capture pytest diagnostics
        run: python -m pytest -q --tb=short > .release-pytest-diagnostics.txt 2>&1 || true
      - name: Commit diagnostics
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .release-pytest-diagnostics.txt
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'test: capture automatic release diagnostics'
          git push origin HEAD:feat/automatic-release-pipeline
