name: Apply reviewed hardening

on:
  push:
    branches:
      - stabilize/public-readiness-20260724

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Report start
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr comment 16 --body "HARDENING_APPLY_STARTED=${GITHUB_RUN_ID}"
      - name: Apply locally validated patch
        run: |
          base64 --decode .github/hardening.patch.gz.b64 | gzip --decompress > /tmp/hardening.patch
          git apply --binary --whitespace=error-all /tmp/hardening.patch
          rm -f .github/hardening.patch.gz.b64
          rm -f src/djobs/__pycache__/__init__.cpython-313.pyc src/djobs/__pycache__/daemon.cpython-313.pyc
          find src/djobs -type f -path '*/__pycache__/*.pyc' -delete
      - name: Commit reviewed hardening
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "chore: harden first-user release readiness"
          git push origin "HEAD:${{ github.ref_name }}"
          gh pr comment 16 --body "HARDENING_COMMIT=$(git rev-parse HEAD)"
