name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # Use the same pinned ruff version as the local pre-push hook
      # (.pre-commit-config.yaml) so local and CI can never drift.
      - run: pip install pre-commit
      - run: pre-commit run ruff-check --all-files
      - run: pre-commit run ruff-format --all-files

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev,pg]"
      - run: mypy

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - name: Run tests
        shell: bash
        run: |
          set -o pipefail
          pytest -q --tb=short 2>&1 | tee pytest-${{ matrix.python-version }}.log
      - name: Upload failed test log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-${{ matrix.python-version }}-failure
          path: pytest-${{ matrix.python-version }}.log
          if-no-files-found: error

  test-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: djobs
          POSTGRES_PASSWORD: djobs
          POSTGRES_DB: djobs
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U djobs"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DJOBS_TEST_PG_DSN: postgresql://djobs:djobs@localhost:5432/djobs
      DJOBS_REQUIRE_PG: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev,pg]"
      - name: Run tests against PostgreSQL backend
        run: pytest -q --tb=short tests/integration/test_repository_contract.py

  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: vscode-ext/package-lock.json
      - run: npm ci
        working-directory: vscode-ext
      - run: npx tsc -p ./ --noEmit
        working-directory: vscode-ext
      - run: npm run compile
        working-directory: vscode-ext

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/
          if-no-files-found: error

  installed-smoke:
    needs: package
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist
      - run: python scripts/smoke_install.py --wheel dist
