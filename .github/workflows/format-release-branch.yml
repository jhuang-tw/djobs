name: Format automatic release branch

on:
  push:
    branches: [feat/automatic-release-pipeline]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/automatic-release-pipeline
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install ruff==0.15.14
      - name: Apply safe Ruff fixes and formatting
        run: |
          ruff check --fix --config pyproject.toml src tests scripts/prepare_auto_release.py || true
          ruff format --config pyproject.toml src tests scripts/prepare_auto_release.py
          ruff check --config pyproject.toml src tests scripts/prepare_auto_release.py > .release-ruff-diagnostics.txt 2>&1 || true
      - name: Commit formatting and diagnostics
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src tests scripts/prepare_auto_release.py .release-ruff-diagnostics.txt
          git commit -m 'style: format automatic release tooling'
          git push origin HEAD:feat/automatic-release-pipeline
