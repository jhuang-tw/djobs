name: Prepare 0.14.0 release

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: prepare-014-${{ github.event.pull_request.head.ref }}
  cancel-in-progress: true

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python tools/_fix_prepare_release_014.py
      - run: python tools/_prepare_release_014.py
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff format src tests
      - run: python -m ruff check src tests
      - run: pytest -q --tb=short tests/unit/test_release_surfaces.py tests/unit/test_release_site_guards.py tests/unit/test_copilot_setup.py
      - run: git diff --check
      - name: Build final file archive
        shell: bash
        run: |
          mkdir -p release-output
          {
            git diff --name-only --diff-filter=ACMRT
            git ls-files --others --exclude-standard
          } | sort -u | grep -v -E '^(tools/_prepare_release_014.py|tools/_fix_prepare_release_014.py|\.github/workflows/release-prep-014.yml)$' > release-output/files.txt
          tar -czf release-output/release-files.tar.gz -T release-output/files.txt
          git diff --stat > release-output/diff-stat.txt
      - uses: actions/upload-artifact@v4
        with:
          name: release-014-final-tree
          path: release-output
          if-no-files-found: error
