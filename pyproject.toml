[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "djobs"
dynamic = ["version"]
description = "Token-saving durable context for Codex, Claude, Gemini, Copilot, Cursor, Cline, and any MCP coding agent."
requires-python = ">=3.11"
license = "MIT"
readme = "README.md"
keywords = ["mcp", "mcp-server", "ai-agent", "ai-coding-agent", "codex", "claude-code", "gemini", "copilot", "cursor", "cline", "token-savings", "crash-recovery", "workflow-state", "durable", "sqlite", "audit-log"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Environment :: Console",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: System :: Distributed Computing",
]

dependencies = [
    "mcp[cli]>=1.0",
]

[project.urls]
Homepage = "https://jhuang-tw.github.io/djobs/"
Repository = "https://github.com/jhuang-tw/djobs"
Documentation = "https://jhuang-tw.github.io/djobs/"
Issues = "https://github.com/jhuang-tw/djobs/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "PyYAML>=6.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "pre-commit>=3.5",
]
pg = [
    "psycopg[binary]>=3.1",
]

[project.scripts]
djobs = "djobs.cli:main"
djobs-mcp = "djobs.mcp_server:main"

[tool.hatch.version]
path = "src/djobs/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/djobs"]

[tool.hatch.build.targets.sdist]
include = [
    "src/djobs",
    "migrations",
    "README.md",
    "CHANGELOG.md",
    "LICENSE",
    "pyproject.toml",
]
exclude = [
    "vscode-ext",
    ".gitignore",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
src = ["src", "tests"]
target-version = "py311"
line-length = 99

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]

[tool.mypy]
python_version = "3.11"
files = ["src/djobs"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
