name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FULL_CI: "true"

jobs:
  # Keep the existing required check name. For ordinary human PRs this one job
  # runs the complete quick preflight. Main, manual runs, and automated release
  # PRs use it only for deterministic formatting and lint because the full jobs
  # below run in parallel.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: vscode-ext/package-lock.json
      - run: python -m pip install -e ".[dev,pg]"
      - name: Run shared preflight
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
        shell: bash
        run: |
          set -o pipefail
          python scripts/preflight.py --profile lint --check --base-ref origin/main \
            2>&1 | tee preflight.log
      - name: Upload failed preflight log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: preflight-failure
          path: preflight.log
          if-no-files-found: error

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[dev,pg]"
      - run: mypy

  # Matrix jobs stay instantiated on ordinary PRs so existing branch rules keep
  # seeing test (3.10) ... test (3.14). Their no-op step finishes in seconds;
  # only main, manual, and release-PR runs install Python dependencies.
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Covered by quick preflight
        if: env.FULL_CI != 'true'
        run: echo "Python compatibility runs on main and automated release PRs."
      - if: env.FULL_CI == 'true'
        uses: actions/checkout@v4
      - if: env.FULL_CI == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - if: env.FULL_CI == 'true'
        run: python -m pip install -e ".[dev]"
      - name: Run tests
        if: env.FULL_CI == 'true'
        shell: bash
        run: |
          set -o pipefail
          pytest -q --tb=short 2>&1 | tee pytest-${{ matrix.python-version }}.log
      - name: Upload failed test log
        if: failure() && env.FULL_CI == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: pytest-${{ matrix.python-version }}-failure
          path: pytest-${{ matrix.python-version }}.log
          if-no-files-found: error

  test-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: djobs
          POSTGRES_PASSWORD: djobs
          POSTGRES_DB: djobs
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U djobs"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DJOBS_TEST_PG_DSN: postgresql://djobs:djobs@localhost:5432/djobs
      DJOBS_REQUIRE_PG: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[dev,pg]"
      - name: Run tests against PostgreSQL backend
        run: pytest -q --tb=short tests/integration/test_repository_contract.py

  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: vscode-ext/package-lock.json
      - run: npm ci
        working-directory: vscode-ext
      - run: npx tsc -p ./ --noEmit
        working-directory: vscode-ext
      - run: npm run compile
        working-directory: vscode-ext

  # Package is also kept as a named lightweight placeholder on ordinary PRs so
  # installed-smoke can expand into its three required matrix check names.
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Covered by quick preflight
        if: env.FULL_CI != 'true'
        run: echo "Package validation runs on main and automated release PRs."
      - if: env.FULL_CI == 'true'
        uses: actions/checkout@v4
      - if: env.FULL_CI == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - if: env.FULL_CI == 'true'
        run: python -m pip install --upgrade build twine
      - if: env.FULL_CI == 'true'
        run: python -m build
      - if: env.FULL_CI == 'true'
        run: python -m twine check dist/*
      - if: env.FULL_CI == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/
          if-no-files-found: error

  installed-smoke:
    needs: package
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Covered by quick preflight
        if: env.FULL_CI != 'true'
        run: echo "Installed-wheel smoke tests run on main and automated release PRs."
      - if: env.FULL_CI == 'true'
        uses: actions/checkout@v4
      - if: env.FULL_CI == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - if: env.FULL_CI == 'true'
        uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist
      - if: env.FULL_CI == 'true'
        run: python scripts/smoke_install.py --wheel dist
